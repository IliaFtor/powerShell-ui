add_newline = true

format = """
$directory$git_branch$git_status$python$nodejs$rust$package$fill$cmd_duration$time
$username$character"""

[directory]
style = "bg:#89b4fa fg:#1e1e2e bold"
format = "[](fg:#89b4fa)[  $path ]($style)[](fg:#89b4fa)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = " Documents"
"Downloads" = " Downloads"
"Desktop" = " Desktop"
"Pictures" = " Pictures"
"Music" = " Music"

[fill]
symbol = " "

[git_branch]
symbol = ""
format = "[$symbol $branch](fg:#a6e3a1) "

[git_status]
format = "[($all_status$ahead_behind)](fg:#f9e2af) "
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${count}"

[python]
symbol = ""
format = "[$symbol $version](fg:#6c7086) "

[nodejs]
symbol = ""
format = "[$symbol $version](fg:#6c7086) "

[rust]
symbol = ""
format = "[$symbol $version](fg:#6c7086) "

[package]
symbol = ""
format = "[$symbol $version](fg:#6c7086) "

[cmd_duration]
min_time = 2000
format = "[ $duration](fg:#f9e2af) "

[time]
disabled = false
time_format = "%H:%M"
format = "[$time](fg:#6c7086)"

[username]
show_always = true
style_user = "fg:#cba6f7"
style_root = "fg:#f38ba8"
format = "[$user]($style) "

[character]
success_symbol = "[>](bold fg:#a6e3a1) "
error_symbol = "[>](bold fg:#f38ba8) "
